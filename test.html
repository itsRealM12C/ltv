<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>M2 TV Transfer</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: sans-serif; text-align: center; padding: 10px; }
        #video { width: 100%; max-width: 800px; border: 2px solid #333; }
        .box { background: #111; padding: 20px; border: 1px solid #00ff41; margin-top: 10px; }
        button { 
            background: #00ff41; color: #000; border: none; 
            padding: 20px; width: 100%; font-size: 1.2rem; 
            font-weight: bold; cursor: pointer; 
        }
        .rec-active { background: #ff0000; color: #fff; }
        #link-area { 
            margin-top: 20px; padding: 15px; background: #222; 
            word-break: break-all; border: 1px dashed #00ff41; 
            display: none;
        }
        .loader { color: #ffae00; margin: 10px 0; display: none; }
    </style>
</head>
<body>

    <video id="video" controls autoplay></video>

    <div class="box">
        <button id="recBtn" onclick="toggleRec()">START RECORDING</button>
        
        <div id="loader" class="loader">UPLOADING TO CLOUD... KEEP TV ON</div>
        
        <div id="link-area">
            <div style="color: #fff; margin-bottom: 10px;">OPEN THIS ON ANDROID:</div>
            <strong id="final-url" style="font-size: 1.1rem;"></strong>
        </div>
    </div>

<script>
    const video = document.getElementById('video');
    const recBtn = document.getElementById('recBtn');
    const loader = document.getElementById('loader');
    const linkArea = document.getElementById('link-area');
    const finalUrl = document.getElementById('final-url');

    let hls, recorder, chunks = [];
    const streamSource = "https://c202-node62-cdn.connectmedia.hu/110102/fca56d4d40af56e3c06912e90cd730b2/69cad9c9/index.m3u8?v=5iip:";

    // Init HLS
    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(streamSource);
        hls.attachMedia(video);
    }

    function toggleRec() {
        if (recorder && recorder.state === "recording") {
            recorder.stop();
            recBtn.innerText = "PROCESSING...";
            recBtn.disabled = true;
        } else {
            startRec();
        }
    }

    function startRec() {
        chunks = [];
        const stream = video.captureStream();
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=h264' });

        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

        recorder.onstop = async () => {
            loader.style.display = "block";
            const blob = new Blob(chunks, { type: 'video/mp4' });
            
            // Upload to Catbox (Free, no account, direct MP4 link)
            const fd = new FormData();
            fd.append('reqtype', 'fileupload');
            fd.append('fileToUpload', blob, `m2_${Date.now()}.mp4`);

            try {
                const res = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: fd });
                const url = await res.text();
                
                loader.style.display = "none";
                linkArea.style.display = "block";
                finalUrl.innerText = url;
                
                recBtn.innerText = "START NEW RECORD";
                recBtn.disabled = false;
                recBtn.classList.remove('rec-active');
            } catch (e) {
                alert("AI sucks ass.");
            }
        };

        recorder.start(1000);
        recBtn.innerText = "STOP & SEND TO ANDROID";
        recBtn.classList.add('rec-active');
        linkArea.style.display = "none";
    }
</script>
</body>
</html>
