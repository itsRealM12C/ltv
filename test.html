<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Engine: LG TV Cloud Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; padding: 20px; }
        .player-card { max-width: 900px; margin: auto; border: 2px solid #00ff41; padding: 10px; }
        video { width: 100%; background: #111; }
        .console { background: #111; padding: 15px; margin-top: 10px; font-size: 12px; border: 1px solid #333; }
        .controls { margin: 15px 0; display: flex; gap: 10px; }
        button { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 15px; cursor: pointer; font-weight: bold; flex-grow: 1; }
        button.recording { background: #ff0000; color: #fff; border: none; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        .url-box { color: #fff; background: #222; padding: 10px; margin-top: 10px; word-break: break-all; border-left: 4px solid #00ff41; }
        .loading { color: #ffae00; font-weight: bold; }
    </style>
</head>
<body>

<div class="player-card">
    <video id="video" controls autoplay></video>
    
    <div class="controls">
        <button id="recBtn" onclick="toggleRecording()">Start Record</button>
        <button onclick="refreshSource()">Refresh</button>
    </div>

    <div class="console">
        <div>STATUS: <span id="status">READY</span></div>
        <div>WEB URL (EXPORT):</div>
        <div id="cloud-url" class="url-box">No cloud export yet...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const recBtn = document.getElementById('recBtn');
    const statusLabel = document.getElementById('status');
    const cloudUrlDisplay = document.getElementById('cloud-url');
    
    let hls, mediaRecorder, recordedChunks = [];
    let sourceUrl = "https://c202-node62-cdn.connectmedia.hu/110102/fca56d4d40af56e3c06912e90cd730b2/69cad9c9/index.m3u8?v=5";

    function initPlayer(url) {
        const streamUrl = url.includes("?v=5") ? url.replace("?v=5", "?v=5iip:") : url;
        if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) refreshSource(); });
            statusLabel.innerText = "STREAMING";
        }
    }

    function toggleRecording() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            statusLabel.innerText = "PROCESSING UPLOAD...";
        } else {
            startRecording();
        }
    }

    function startRecording() {
        recordedChunks = [];
        const stream = video.captureStream();
        
        // LG TVs prefer standard webm/h264
        mediaRecorder = new MediaRecorder(stream, {
            mimeType: 'video/webm;codecs=h264',
            videoBitsPerSecond: 3000000 
        });

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
            recBtn.innerText = "Start Record";
            recBtn.classList.remove('recording');

            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            uploadToCloud(blob);
        };

        mediaRecorder.start(1000);
        recBtn.innerText = "STOP & EXPORT";
        recBtn.classList.add('recording');
        statusLabel.innerText = "RECORDING LIVE...";
    }

    // This bypasses the LG TV download restriction by uploading to a public host
    async function uploadToCloud(blob) {
        cloudUrlDisplay.innerHTML = '<span class="loading">UPLOADING TO CLOUD... PLEASE WAIT</span>';
        
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', blob, `capture_${Date.now()}.mp4`);

        try {
            // Using Catbox.moe API (CORS allows browser uploads)
            const response = await fetch('https://catbox.moe/user/api.php', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const fileUrl = await response.text();
                cloudUrlDisplay.innerHTML = `<a href="${fileUrl}" target="_blank" style="color:#00ff41;">${fileUrl}</a>`;
                statusLabel.innerText = "EXPORT SUCCESS";
            } else {
                throw new Error("Upload failed");
            }
        } catch (err) {
            cloudUrlDisplay.innerText = "Upload failed. Try a smaller recording.";
            statusLabel.innerText = "ERROR";
            console.error(err);
        }
    }

    function refreshSource() { initPlayer(sourceUrl); }
    initPlayer(sourceUrl);
</script>
</body>
</html>
